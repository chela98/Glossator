name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Build & Test Solution
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Glossator.slnx

      - name: Build Solution
        run: dotnet build Glossator.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Glossator.slnx --configuration Release --no-build --verbosity normal

  publish-studio-win-x64:
    name: Publish Glossator Studio (win-x64)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Glossator.App (self-contained win-x64 single-file)
        run: >
          dotnet publish Glossator.App/Glossator.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:SatelliteResourceLanguages=en%3Btr
          -p:DebugType=none
          -p:DebugSymbols=false
          --output dist/Glossator-Studio-win-x64

      - name: Verify Layout & Run Smoke Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'dist/Glossator-Studio-win-x64'
          foreach ($rel in @('Glossator.App.exe', 'appsettings.example.json', 'Prompts/StyleAnalystPrompt.md', 'Prompts/TranslatorPrompt.md', 'Prompts/ReviewerPrompt.md')) {
            if (-not (Test-Path (Join-Path $dir $rel))) {
              throw "Missing required release file: $rel"
            }
          }
          $env:GLOSSATOR_SMOKE_TEST = '1'
          $p = Start-Process -FilePath (Join-Path $dir 'Glossator.App.exe') -PassThru -Wait
          Remove-Item Env:GLOSSATOR_SMOKE_TEST -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            throw "Studio smoke test failed with ExitCode=$($p.ExitCode)"
          }

      - name: Archive Windows Studio Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path dist/Glossator-Studio-win-x64/* -DestinationPath release/Glossator-Studio-win-x64.zip -Force

      - name: Upload Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-studio-win-x64
          path: release/Glossator-Studio-win-x64.zip
          if-no-files-found: error

  publish-cli:
    name: Publish Glossator CLI (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Glossator.Cli (${{ matrix.rid }} single-file)
        run: >
          dotnet publish Glossator.Cli/Glossator.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:SatelliteResourceLanguages=en%3Btr
          -p:DebugType=none
          -p:DebugSymbols=false
          --output dist/Glossator-CLI-${{ matrix.rid }}

      - name: Archive CLI Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'dist/Glossator-CLI-win-x64'
          foreach ($rel in @('glossator.exe', 'appsettings.example.json', 'Prompts/TranslatorPrompt.md')) {
            if (-not (Test-Path (Join-Path $dir $rel))) {
              throw "Missing required CLI release file: $rel"
            }
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath release/Glossator-CLI-win-x64.zip -Force

      - name: Archive CLI Package (Linux)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          dir="dist/Glossator-CLI-linux-x64"
          test -f "$dir/glossator"
          test -f "$dir/appsettings.example.json"
          test -f "$dir/Prompts/TranslatorPrompt.md"
          mkdir -p release
          tar -czf release/Glossator-CLI-linux-x64.tar.gz -C dist "Glossator-CLI-linux-x64"

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.rid }}
          path: release/Glossator-CLI-${{ matrix.rid }}.${{ matrix.ext }}
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [publish-studio-win-x64, publish-cli]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Built Packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Glossator-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release Notes & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Glossator ${{ github.ref_name }}"
            echo ""
            echo "### İndirilebilir Paketler"
            echo "- **Glossator-Studio-win-x64.zip** — Windows 10/11 Fluent Masaüstü Stüdyosu (self-contained .NET 10, SDK kurulumu gerektirmez)"
            echo "- **Glossator-CLI-win-x64.zip** — Windows komut satırı aracı (self-contained)"
            echo "- **Glossator-CLI-linux-x64.tar.gz** — Linux x64 komut satırı aracı (self-contained)"
            echo "- **SHA256SUMS.txt** — Paket bütünlüğü doğrulama özetleri"
            echo ""
            echo "### İlk Kurulum"
            echo "1. Arşivi çıkarıp uygulamayı başlatın; **EVREN** varsayılan profilinin yanında **Gemini**, **OpenAI**, **Ollama** (yerel) ve **Custom** profilleri hazır gelir."
            echo "2. Studio **Ayarlar** sekmesinden API anahtarınızı girin (veya farklı sağlayıcı seçin), **Ping** ile doğrulayıp kaydedin. Ayarlar \`~/.glossator/user_settings.json\` dosyasında saklanır."
            echo ""
            echo "### Güvenlik ve Windows SmartScreen Notu"
            echo "Bu paketler açık kaynak topluluk derlemesidir ve ticari EV/OV kod imzalama sertifikası içermez. Windows SmartScreen ilk çalıştırmada uyarı gösterirse **Ek bilgi (More info) → Yine de çalıştır (Run anyway)** adımını kullanabilir ve indirdiğiniz arşivi \`SHA256SUMS.txt\` ile doğrulayabilirsiniz:"
            echo ""
            echo '```powershell'
            echo 'Get-FileHash Glossator-Studio-win-x64.zip -Algorithm SHA256'
            echo '```'
          } > release-notes.md

          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "Glossator ${{ github.ref_name }}" \
            --notes-file release-notes.md
