name: CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Glossator.slnx

    - name: Build Solution
      run: dotnet build Glossator.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test Glossator.slnx --configuration Release --no-build --verbosity normal

  linux-cross-platform-test:
    name: Build & Test Cross-Platform (Linux net10.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Core / AI / CLI / Tests Dependencies
      run: dotnet restore Glossator.Tests/Glossator.Tests.csproj

    - name: Build Cross-Platform Projects (net10.0 Release)
      run: dotnet build Glossator.Tests/Glossator.Tests.csproj --configuration Release --no-restore

    - name: Run Cross-Platform Unit Tests (net10.0)
      run: dotnet test Glossator.Tests/Glossator.Tests.csproj --configuration Release --no-build --verbosity normal
