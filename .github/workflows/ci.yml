name: CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Glossator.slnx

    - name: Build Solution
      run: dotnet build Glossator.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test Glossator.slnx --configuration Release --no-build --verbosity normal
